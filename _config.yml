# Fallback exclusions for branch-based Jekyll publishing.
# The GitHub Actions workflow publishes only the packaged _site/ directory.
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - reports
  - eslint.config.mjs
  - stylelint.config.mjs
